<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>KelvinOz AI</title>
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body>
  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-header">
      <div class="logo-sm">✦</div>
      <div>
        <strong>KelvinOz AI</strong>
        <span>kelvinoz.com</span>
      </div>
      <button type="button" id="sidebar-close" class="sidebar-close" aria-label="Close menu">✕</button>
    </div>
    <button type="button" id="new-chat" class="btn-new">+ New Chat</button>
    <div id="conversations" class="conversations"></div>
    <div class="sidebar-footer">
      <button type="button" id="deploy-btn" class="btn-deploy">Deploy to kelvinoz.com</button>
      <button type="button" id="logout">Log out</button>
    </div>
  </aside>

  <div class="shell">
    <header class="topbar">
      <button type="button" id="menu-btn" class="menu-btn" aria-label="Open menu">
        <span></span><span></span><span></span>
      </button>
      <h1 id="chat-title">KelvinOz AI</h1>
      <button type="button" id="files-toggle" class="files-btn" hidden>
        <span id="files-count">0</span>
      </button>
    </header>

    <div id="files-panel" class="files-panel" hidden>
      <div class="files-panel-header">
        <strong>Project files</strong>
        <button type="button" id="files-close" class="icon-btn-sm" aria-label="Close files">✕</button>
      </div>
      <div id="files-list" class="files-list"></div>
    </div>

    <div id="messages" class="messages">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">✦</div>
        <h2>Code anything.</h2>
        <p>Uncensored AI · Deploy to kelvinoz.com · No limits</p>
        <div class="suggestions">
          <button type="button" class="suggestion" data-prompt="Build a React landing page and save all files">Build a React landing page</button>
          <button type="button" class="suggestion" data-prompt="Write a Node.js API with auth and save the files">Write a Node.js API with auth</button>
          <button type="button" class="suggestion" data-prompt="Deploy the latest changes to kelvinoz.com">Deploy to kelvinoz.com</button>
        </div>
      </div>
    </div>

    <div id="error" class="error-bar" hidden></div>

    <footer class="composer">
      <div id="attachments" class="attachments" hidden></div>
      <div class="composer-box">
        <button type="button" id="attach-btn" class="plus-btn" aria-label="Attach photo, video, or file">+</button>
        <input id="file-input" type="file" accept="image/*,video/*,.txt,.js,.ts,.tsx,.jsx,.py,.json,.md,.css,.html,.zip,.pdf" multiple hidden />
        <textarea id="input" rows="1" placeholder="Ask anything — code, debug, build…"></textarea>
        <button type="button" id="send" class="send-btn" aria-label="Send">↑</button>
      </div>
      <p class="input-hint">Enter to send · Shift+Enter for new line</p>
    </footer>
  </div>

  <script src="/app.js?v=5"></script>
</body>
</html>
