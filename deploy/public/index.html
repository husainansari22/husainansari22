<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>KelvinOz AI</title>
  <link rel="stylesheet" href="/styles.css?v=2" />
</head>
<body>
  <div id="overlay" class="overlay" hidden></div>

  <aside id="sidebar" class="sidebar" aria-hidden="true">
    <div class="sidebar-top">
      <strong class="sidebar-brand">KelvinOz AI</strong>
      <button type="button" id="sidebar-search" class="icon-btn" aria-label="Search" title="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </div>

    <nav class="sidebar-nav">
      <button type="button" class="nav-item" data-nav="library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19a2 2 0 0 0 2 2h12"/><path d="M6 3h12v16H6z"/><path d="M10 3v16"/></svg>
        <span>Library</span>
      </button>
      <button type="button" class="nav-item" data-nav="projects">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>Projects</span>
      </button>
      <button type="button" class="nav-item" data-nav="plugins">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <span>Plugins</span>
      </button>
      <button type="button" class="nav-item" data-nav="codex">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 18a5 5 0 1 1 2-9.6A6 6 0 0 1 20 12a4 4 0 0 1-1 7.9H7z"/><circle cx="12" cy="13" r="2"/><path d="M12 11v-1"/></svg>
        <span>Codex</span>
      </button>
      <button type="button" class="nav-item" data-nav="images">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l6-8 4 5 3-4 3 7H4z"/><path d="M14 7l2-3 2 3"/><path d="M12 10v7"/></svg>
        <span>Images</span>
      </button>
    </nav>

    <div class="recents-head">Recents</div>
    <div id="recents" class="recents"></div>

    <div class="sidebar-bottom">
      <button type="button" id="new-chat" class="chat-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Chat
      </button>
      <button type="button" id="open-settings" class="icon-btn" aria-label="Settings">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9c.2.6.7 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </aside>

  <div id="app" class="app">
    <header class="topbar">
      <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu">
        <span class="burger"><i></i><i></i></span>
      </button>
      <div class="top-actions">
        <button type="button" id="new-chat-top" class="icon-btn" aria-label="New chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button type="button" id="more-btn" class="icon-btn" aria-label="More">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <div id="error" class="error" hidden></div>

    <footer class="composer">
      <div class="composer-pill">
        <button type="button" id="attach-btn" class="icon-btn soft" aria-label="Add">+</button>
        <textarea id="input" rows="1" placeholder="Ask KelvinOz AI"></textarea>
        <button type="button" id="mic-btn" class="icon-btn soft" aria-label="Voice" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg>
        </button>
        <button type="button" id="send" class="send" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 12h11M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <section id="settings" class="settings" hidden>
    <header class="settings-top">
      <button type="button" id="settings-back" class="icon-btn" aria-label="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <strong>KelvinOz AI</strong>
      <span></span>
    </header>

    <div class="settings-body">
      <label class="field-label" for="system-prompt">System Prompt</label>
      <textarea
        id="system-prompt"
        class="system-prompt"
        rows="6"
        placeholder="You are a helpful assistant..."
        spellcheck="false"
      ></textarea>

      <div class="toggles">
        <label class="toggle">
          <input type="checkbox" id="web-search" checked />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">Web Search</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="nomask-prompt" checked />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">NoMask Prompt</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="stream" checked />
          <span class="switch" aria-hidden="true"></span>
          <span class="toggle-text">Stream</span>
        </label>
      </div>
    </div>
  </section>

  <script src="/app.js?v=2"></script>
</body>
</html>
