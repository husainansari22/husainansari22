<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>KelvinOz AI</title>
  <link rel="stylesheet" href="/styles.css?v=1" />
</head>
<body>
  <div class="shell">
    <header class="brand">KelvinOz AI</header>

    <label class="field-label" for="system-prompt">System Prompt</label>
    <textarea
      id="system-prompt"
      class="system-prompt"
      rows="5"
      placeholder="You are a helpful assistant..."
      spellcheck="false"
    ></textarea>

    <div class="toggles">
      <label class="toggle">
        <input type="checkbox" id="web-search" checked />
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-text">Web Search</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="nomask-prompt" checked />
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-text">NoMask Prompt</span>
      </label>
      <label class="toggle">
        <input type="checkbox" id="stream" checked />
        <span class="switch" aria-hidden="true"></span>
        <span class="toggle-text">Stream</span>
      </label>
    </div>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="error" class="error" hidden></div>

    <footer class="composer">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Hello!"></textarea>
        <button type="button" id="send" class="send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        </button>
      </div>
    </footer>
  </div>
  <script src="/app.js?v=1"></script>
</body>
</html>
